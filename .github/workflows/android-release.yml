name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Environment Configuration
        run: |
          touch .env

      - name: Configure Release Signing Credentials
        id: signing_config
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::notice::Using custom release signing credentials from GitHub Secrets."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "::notice::KEYSTORE_BASE64 secret not found. Generating a dedicated CI release signing keystore."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android_release_pass" \
              -keypass "android_release_pass" \
              -dname "CN=OOPS WORLD, OU=Games, O=5key, L=City, ST=State, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android_release_pass" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android_release_pass" >> $GITHUB_ENV
          fi

      - name: Determine Semantic Release Tag
        id: semver
        run: |
          RAW_VERSION=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="1.0.0"
          fi

          if [[ "$RAW_VERSION" =~ ^[0-9]+$ ]]; then
            SEM_VERSION="${RAW_VERSION}.0.0"
          elif [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            SEM_VERSION="${RAW_VERSION}.0"
          else
            SEM_VERSION="$RAW_VERSION"
          fi

          TARGET_TAG="v${SEM_VERSION}"

          git fetch --tags --force 2>/dev/null || true
          if git rev-parse "$TARGET_TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TARGET_TAG" | grep -q "$TARGET_TAG"; then
            echo "Tag $TARGET_TAG already exists. Incrementing patch version..."
            MAJOR_MINOR=$(echo "$SEM_VERSION" | cut -d'.' -f1,2)
            CURRENT_PATCH=$(echo "$SEM_VERSION" | cut -d'.' -f3)
            MAX_PATCH=$((CURRENT_PATCH + 1))

            for existing_tag in $(git tag -l "v${MAJOR_MINOR}.*"); do
              TAG_PATCH=$(echo "$existing_tag" | sed -E "s/^v${MAJOR_MINOR}\.//" | grep -E '^[0-9]+$' || true)
              if [ -n "$TAG_PATCH" ] && [ "$TAG_PATCH" -ge "$MAX_PATCH" ]; then
                MAX_PATCH=$((TAG_PATCH + 1))
              fi
            done
            TARGET_TAG="v${MAJOR_MINOR}.${MAX_PATCH}"
          fi

          echo "Final Semantic Version Tag: $TARGET_TAG"
          echo "RELEASE_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$SEM_VERSION" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleRelease --stacktrace
          else
            gradle :app:assembleRelease --stacktrace
          fi

      - name: Prepare Release APK Asset
        id: prepare_asset
        run: |
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$BUILT_APK" ] || [ ! -f "$BUILT_APK" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release!"
            exit 1
          fi

          OUTPUT_APK="OOPS-WORLD-${{ env.RELEASE_TAG }}.apk"
          cp "$BUILT_APK" "$OUTPUT_APK"
          SHA256=$(sha256sum "$OUTPUT_APK" | cut -d' ' -f1)
          FILE_SIZE=$(du -h "$OUTPUT_APK" | cut -f1)

          echo "APK_PATH=$OUTPUT_APK" >> $GITHUB_ENV
          echo "APK_FILENAME=$OUTPUT_APK" >> $GITHUB_ENV
          echo "APK_SHA256=$SHA256" >> $GITHUB_ENV
          echo "APK_SIZE=$FILE_SIZE" >> $GITHUB_ENV

          echo "Successfully prepared: $OUTPUT_APK ($FILE_SIZE)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OOPS! WORLD ${{ env.RELEASE_TAG }} – Android Release
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            Official Android release build of OOPS! WORLD — 2D endless cartoon survival game!

            Release Asset:
            - Download File: ${{ env.APK_FILENAME }}
            - File Size: ${{ env.APK_SIZE }}
            - SHA-256 Checksum: ${{ env.APK_SHA256 }}

            Installation Instructions:
            1. Download the APK.
            2. Open the downloaded APK.
            3. Install the application.
            4. Launch OOPS! WORLD and play!
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🚀 Android Release Published Successfully!

          | Item | Detail |
          | --- | --- |
          | **Release Tag** | `${{ env.RELEASE_TAG }}` |
          | **Package** | `${{ env.APK_FILENAME }}` |
          | **File Size** | `${{ env.APK_SIZE }}` |
          | **SHA-256** | `${{ env.APK_SHA256 }}` |
          | **Commit** | `${{ github.sha }}` |

          The release APK has been attached to the GitHub Release.
          EOF
          else
            cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### ❌ Build & Release Failed

          The Android APK build or release process encountered an error. Please inspect the workflow logs above for details.
          EOF
          fi

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/my-upload-key.jks"
